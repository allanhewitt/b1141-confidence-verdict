name: Backend checks

on:
  push:
    branches:
      - stage3-cwd-backend
      - stage3-cwd-self-audit
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b1141_confidence_verdict_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b1141_confidence_verdict_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/b1141_confidence_verdict_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node --check server.js
      - run: node --check stage3-cwd.js
      - run: node --check stage3-cwd-self-audit.js
      - run: node --check lib/cwd-self-audit.js
      - name: Build test database through migrations
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_stage3_cwd_architecture.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/002_cwd_session_snapshots.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/003_cwd_self_audit_variant.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/004_cwd_b1141_activity_repertoire.sql
      - run: npm test
